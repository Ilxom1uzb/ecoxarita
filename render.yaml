# Render Blueprint: bitta bosishda baza, API va frontend yaratiladi
databases:
  - name: ecoxarita-db
    plan: basic-256mb        # Free rejada 30 kundan keyin o'chadi
    databaseName: ecoxarita
    user: ecoxarita

services:
  - type: web
    name: ecoxarita-api
    runtime: node
    rootDir: backend
    plan: starter            # Persistent disk faqat pullik rejalarda
    buildCommand: npm install
    # migrate idempotent (CREATE IF NOT EXISTS), har deploy'da xavfsiz ishlaydi
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL       # Render ichki ulanish: SSL shart emas
        fromDatabase:
          name: ecoxarita-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true     # Render avtomatik tasodifiy kalit yaratadi
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: CORS_ORIGIN        # Frontend URL (deploy'dan keyin yozing)
        sync: false
      - key: ADMIN_EMAIL        # Faqat seed uchun, Shell'da ishlatiladi
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BREVO_API_KEY      # brevo.com → SMTP & API → API Keys
        sync: false
      - key: MAIL_FROM_EMAIL    # Brevo'da tasdiqlangan sizning emailingiz
        sync: false
      - key: MAIL_FROM_NAME
        value: EcoXarita
    disk:
      name: uploads
      mountPath: /data
      sizeGB: 5

  - type: web
    name: ecoxarita-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL       # Masalan: https://ecoxarita-api.onrender.com
        sync: false
